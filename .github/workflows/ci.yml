name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ten_minute_review:
        description: Run the optional bounded ten-minute installed resource review
        type: boolean
        default: false
  schedule:
    - cron: '43 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile source
        run: python -m compileall -q src tests scripts
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Probe live HTTP security boundary
        run: PYTHONPATH=src python scripts/live_adversarial_test.py
      - name: Inspect deterministic draft skill package
        run: |
          python scripts/package_draft_skill.py --output "$RUNNER_TEMP/skill-a"
          python scripts/package_draft_skill.py --output "$RUNNER_TEMP/skill-b"
          cmp "$RUNNER_TEMP/skill-a/runtime-guard-draft.zip" "$RUNNER_TEMP/skill-b/runtime-guard-draft.zip"
          cmp "$RUNNER_TEMP/skill-a/runtime-guard-draft.manifest.json" "$RUNNER_TEMP/skill-b/runtime-guard-draft.manifest.json"
      - name: Build and inspect committed source archive
        run: |
          git clone --quiet --no-local . "$RUNNER_TEMP/source-checkout"
          git -C "$RUNNER_TEMP/source-checkout" checkout --quiet --detach "$GITHUB_SHA"
          if [ "${{ matrix.python }}" = "3.11" ]; then
            python -m pip install 'setuptools==77.0.3' wheel
          else
            python -m pip install 'setuptools>=77.0.3' wheel
          fi
          (cd "$RUNNER_TEMP/source-checkout" && python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")')
          python scripts/inspect_sdist.py "$RUNNER_TEMP/source-checkout"/dist/*.tar.gz --ref "$GITHUB_SHA"
      - name: Run tests from inspected source archive
        run: |
          python -c 'import glob, os, tarfile; archive = tarfile.open(glob.glob(os.environ["RUNNER_TEMP"] + "/source-checkout/dist/*.tar.gz")[0]); archive.extractall(os.environ["RUNNER_TEMP"] + "/source-unpacked", filter="data"); archive.close()'
          (cd "$RUNNER_TEMP"/source-unpacked/runtime_guard_mcp-* && PYTHONPATH=src python -m unittest discover -s tests -q)
      - name: Build wheel from inspected source archive
        run: python -m pip wheel --no-deps --no-build-isolation "$RUNNER_TEMP/source-checkout"/dist/*.tar.gz -w dist
      - name: Inspect wheel contents and integrity
        run: python scripts/inspect_wheel.py dist/*.whl --ref "$GITHUB_SHA"
      - name: Probe freshly installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/runtime-guard-client"
          "$RUNNER_TEMP/runtime-guard-client/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/runtime-guard-client/bin/python" -I -c 'from importlib.metadata import requires; requirements = requires("runtime-guard-mcp") or []; assert not requirements, f"Runtime dependencies need a documented security justification and CI policy update: {requirements}"'
          "$RUNNER_TEMP/runtime-guard-client/bin/python" -m pip check
          timeout 80s python scripts/invocation_rate_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 100s python scripts/audit_kill_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 30s python scripts/http_error_review.py "$RUNNER_TEMP/runtime-guard-client/bin/python"
          timeout 30s python scripts/audit_startup_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 90s python scripts/sustained_resource_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 45s python scripts/audit_storage_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 30s python scripts/audit_capacity_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 30s python scripts/stdio_adversarial_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/peer_response_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/version_cache_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/context_isolation_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/baggage_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/tracestate_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/traceparent_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 40s python scripts/request_id_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/cancellation_metadata_review.py "$RUNNER_TEMP/runtime-guard-client/bin/python"
          timeout 25s python scripts/queued_cancellation_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 60s python scripts/masker_state_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/request_state_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/implementation_metadata_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 25s python scripts/modern_validation_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 20s python scripts/modern_stdio_smoke.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 20s python scripts/client_smoke.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 40s env PYTHONPATH=src python scripts/live_adversarial_test.py --server "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 40s python scripts/output_backpressure_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
      - name: Probe isolated filesystem-full recovery
        run: timeout 40s sudo -n "$(command -v python)" scripts/filesystem_full_review.py --mount-only "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
      - name: Probe paced concurrent mixed-tool resource bounds
        if: matrix.python == '3.12'
        run: timeout 45s python scripts/concurrent_resource_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
      - name: Probe successful audited writes over three minutes
        if: matrix.python == '3.12'
        run: timeout 215s python scripts/concurrent_resource_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp" --successful-writes
      - name: Probe extended concurrent mixed-tool resource bounds
        if: matrix.python == '3.12'
        run: timeout 155s python scripts/concurrent_resource_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp" --extended
      - name: Probe installed server with official SDK client
        if: matrix.python == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/runtime-guard-sdk-client"
          "$RUNNER_TEMP/runtime-guard-sdk-client/bin/python" -m pip install 'mcp==2.3.0' 'jsonschema==4.26.0'
          timeout 30s "$RUNNER_TEMP/runtime-guard-sdk-client/bin/python" scripts/official_sdk_smoke.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          timeout 30s "$RUNNER_TEMP/runtime-guard-sdk-client/bin/python" scripts/official_sdk_smoke.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp" --modern
          timeout 15s "$RUNNER_TEMP/runtime-guard-sdk-client/bin/python" scripts/offline_schema_review.py
          timeout 40s "$RUNNER_TEMP/runtime-guard-sdk-client/bin/python" scripts/tool_schema_review.py "$RUNNER_TEMP/runtime-guard-client/bin/runtime-guard-mcp"
          "$RUNNER_TEMP/runtime-guard-client/bin/python" -m pip check
      - name: Check repository hygiene
        run: |
          git diff --check
          test -s LICENSE && test -s SECURITY.md && test -s CONTRIBUTING.md

  ten-minute-review:
    if: github.event_name == 'workflow_dispatch' && inputs.ten_minute_review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build and install isolated server
        run: |
          python -m pip install 'setuptools>=77.0.3' wheel
          python -m pip wheel --no-deps --no-build-isolation . -w dist
          python -m venv "$RUNNER_TEMP/ten-minute-server"
          "$RUNNER_TEMP/ten-minute-server/bin/pip" install --no-deps dist/*.whl
      - name: Run bounded successful-write workload
        run: |
          timeout 640s python scripts/concurrent_resource_review.py "$RUNNER_TEMP/ten-minute-server/bin/runtime-guard-mcp" --ten-minute > ten-minute-review.json
          cat ten-minute-review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ten-minute-resource-review
          path: ten-minute-review.json
          if-no-files-found: error
