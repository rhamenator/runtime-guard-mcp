name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test and build source archive
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -q
          python -m pip install 'setuptools>=77.0.3' wheel
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          python scripts/inspect_sdist.py dist/*.tar.gz --ref "$GITHUB_SHA" > dist/source-inspection.json
      - name: Test packaged sources
        run: |
          python -c 'import glob, os, tarfile; archive = tarfile.open(glob.glob("dist/*.tar.gz")[0]); archive.extractall(os.environ["RUNNER_TEMP"] + "/release-source", filter="data"); archive.close()'
          (cd "$RUNNER_TEMP"/release-source/runtime_guard_mcp-* && PYTHONPATH=src python -m unittest discover -s tests -q)
      - name: Build and bind wheel to source
        run: |
          python -m pip wheel --no-deps --no-build-isolation dist/*.tar.gz -w dist
          python scripts/inspect_wheel.py dist/*.whl --ref "$GITHUB_SHA" > dist/wheel-inspection.json
      - name: Probe fresh installed artifact
        run: |
          python -m venv "$RUNNER_TEMP/release-client"
          "$RUNNER_TEMP/release-client/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/release-client/bin/python" -m pip check
          env -u PYTHONPATH -u PYTHONHOME -u RUNTIME_GUARD_CONFIG python scripts/client_smoke.py "$RUNNER_TEMP/release-client/bin/runtime-guard-mcp"
          PYTHONPATH=src python scripts/live_adversarial_test.py --server "$RUNNER_TEMP/release-client/bin/runtime-guard-mcp" > dist/installed-api-review.json
      - name: Checksum reviewed artifacts and reports
        run: (cd dist && sha256sum *.whl *.tar.gz *.json > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-guard-mcp-review-packages
          path: dist/
