name: Experimental macOS package review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-lifecycle:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Build committed candidate wheel and lower-version fixture
        run: |
          python -m pip install 'setuptools>=77.0.3' wheel
          mkdir "$RUNNER_TEMP/candidate-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate-source"
          python -m pip wheel --no-deps --no-build-isolation "$RUNNER_TEMP/candidate-source" -w dist
          python scripts/inspect_wheel.py dist/*.whl --ref "$GITHUB_SHA" > dist/wheel-inspection.json
          python - <<'PYTHON'
          import os, pathlib, re
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate-source/pyproject.toml'
          changed, count = re.subn(r'^version = ".*"$', 'version = "0.0.0"', p.read_text(), count=1, flags=re.M)
          assert count == 1
          p.write_text(changed)
          PYTHON
          python -m pip wheel --no-deps --no-build-isolation "$RUNNER_TEMP/candidate-source" -w "$RUNNER_TEMP/fixture-wheels"
      - name: Native macOS install launch upgrade uninstall and residue review
        run: |
          python scripts/package_lifecycle_review.py "$RUNNER_TEMP"/fixture-wheels/*.whl dist/*.whl > dist/macos-lifecycle-review.json
          python - <<'PYTHON'
          import json, os, platform
          from pathlib import Path
          Path('dist/environment.json').write_text(json.dumps({'source_commit': os.environ['GITHUB_SHA'], 'source_ref': os.environ['GITHUB_REF'], 'platform': platform.platform(), 'machine': platform.machine(), 'python': platform.python_version(), 'scope': 'experimental hosted macOS wheel qualification; not PKG, signing/notarization, every macOS version, desktop UI or supported-platform certification'}, indent=2) + '\n')
          PYTHON
          (cd dist && shasum -a 256 *.whl *.json > SHA256SUMS && shasum -a 256 --check SHA256SUMS)
      - name: Retain experimental macOS artifacts and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-guard-macos-experimental-packages
          retention-days: 90
          path: dist/
